name: Build zip

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip:
    name: Build and attach the distributable zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        run: |
          set -euo pipefail
          path="$(bin/build-zip.sh "$RUNNER_TEMP/dist" | head -1)"
          echo "zip=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.zip }}

      # Releases are published by hand. A tag builds the zip and keeps it as an
      # artifact; deciding that a build is a release is a separate call.
