name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --display-warnings --display-deprecations

  standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Check the zip that would be submitted, not the repository. The two
      # differ: the repository carries tests, CI config and a build script,
      # none of which the directory accepts, and none of which ship.
      - name: Build the distributable
        run: |
          set -euo pipefail
          bin/build-zip.sh "$RUNNER_TEMP/dist" > /dev/null
          mkdir -p "$RUNNER_TEMP/plugin"
          unzip -q "$RUNNER_TEMP"/dist/*.zip -d "$RUNNER_TEMP/plugin"

      - name: Run the official Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ${{ runner.temp }}/plugin/preorder-dates-for-woocommerce
          # The Freemius SDK ships as published. Reviewing it is Freemius' job.
          exclude-directories: 'freemius'
